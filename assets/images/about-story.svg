<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="storyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="softShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#storyBg)"/>

  <!-- Main Card Platform -->
  <rect x="50" y="50" width="700" height="400" rx="16" fill="url(#cardGrad)" filter="url(#softShad)" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Central Teaching Circle -->
  <circle cx="400" cy="220" r="140" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Teacher 1: Mathematics -->
  <g transform="translate(230, 110)">
    <circle cx="40" cy="40" r="32" fill="#DBEAFE"/>
    <text x="40" y="47" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">Math</text>
    <text x="40" y="90" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Conceptual Logic</text>
  </g>

  <!-- Teacher 2: Science -->
  <g transform="translate(470, 110)">
    <circle cx="40" cy="40" r="32" fill="#D1FAE5"/>
    <text x="40" y="47" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle">Sci</text>
    <text x="40" y="90" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Real Inquiry</text>
  </g>

  <!-- Teacher 3: Social Science -->
  <g transform="translate(230, 270)">
    <circle cx="40" cy="40" r="32" fill="#FEF3C7"/>
    <text x="40" y="47" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="#92400E" text-anchor="middle">S.Sci</text>
    <text x="40" y="90" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Deep Insight</text>
  </g>

  <!-- Teacher 4: English -->
  <g transform="translate(470, 270)">
    <circle cx="40" cy="40" r="32" fill="#FCE7F3"/>
    <text x="40" y="47" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="#9D174D" text-anchor="middle">Eng</text>
    <text x="40" y="90" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Clarity &amp; Expression</text>
  </g>

  <!-- Center Core Mission -->
  <g transform="translate(340, 170)">
    <rect width="120" height="100" rx="14" fill="#2563EB" filter="url(#softShad)"/>
    <circle cx="60" cy="38" r="16" fill="#FFFFFF"/>
    <path d="M 60 28 L 63 35 L 70 36 L 65 41 L 66 48 L 60 44 L 54 48 L 55 41 L 50 36 L 57 35 Z" fill="#F59E0B"/>
    <text x="60" y="72" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">OUR MISSION</text>
    <text x="60" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#DBEAFE" text-anchor="middle">Affordable Quality</text>
  </g>

  <!-- Connection Lines from 4 teachers to Center -->
  <line x1="300" y1="170" x2="340" y2="200" stroke="#3B82F6" stroke-width="2"/>
  <line x1="500" y1="170" x2="460" y2="200" stroke="#10B981" stroke-width="2"/>
  <line x1="300" y1="290" x2="340" y2="240" stroke="#F59E0B" stroke-width="2"/>
  <line x1="500" y1="290" x2="460" y2="240" stroke="#EC4899" stroke-width="2"/>
</svg>

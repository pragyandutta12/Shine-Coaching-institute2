<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Wall Elements / Clock -->
  <circle cx="710" cy="90" r="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="710" cy="90" r="3" fill="#2563EB"/>
  <line x1="710" y1="90" x2="710" y2="72" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="710" y1="90" x2="722" y2="90" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Classroom Whiteboard / Blackboard -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="60" width="580" height="240" rx="12" fill="url(#boardGrad)" stroke="#334155" stroke-width="6"/>
    <!-- Board Frame Accents -->
    <rect x="64" y="294" width="592" height="8" rx="3" fill="#475569"/>
    <!-- Content on Board -->
    <text x="100" y="110" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" fill="#93C5FD">SHINE COACHING INSTITUTE</text>
    <text x="100" y="145" font-family="'Inter', sans-serif" font-size="14" fill="#E2E8F0">Concept Mastery &amp; Personal Attention</text>
    
    <!-- Formulas & Diagrams on Board -->
    <text x="100" y="195" font-family="monospace" font-size="16" fill="#FDE047">E = mc²</text>
    <text x="210" y="195" font-family="monospace" font-size="16" fill="#6EE7B7">sin²θ + cos²θ = 1</text>
    <text x="400" y="195" font-family="monospace" font-size="16" fill="#F472B6">F = m · a</text>
    
    <path d="M 100 240 Q 150 210, 200 240 T 300 240" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="320" y="245" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8">Step-by-Step Learning Model</text>
  </g>

  <!-- Teacher Character -->
  <g transform="translate(130, 240)">
    <!-- Teacher Body -->
    <path d="M 60 140 L 40 280 L 100 280 L 80 140 Z" fill="#1E40AF"/>
    <circle cx="70" cy="80" r="30" fill="#FBBF24"/> <!-- Head/Face -->
    <!-- Hair -->
    <path d="M 40 75 Q 70 40 100 75 Q 90 45 60 50 Z" fill="#334155"/>
    <!-- Shirt / Blazer -->
    <path d="M 45 120 L 70 140 L 95 120 L 90 220 L 50 220 Z" fill="#2563EB"/>
    <polygon points="70,120 65,150 75,150" fill="#FFFFFF"/>
    <!-- Arm Pointing to Board -->
    <path d="M 90 135 Q 130 100 160 85" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <circle cx="160" cy="85" r="7" fill="#FBBF24"/>
    <!-- Pointer Stick -->
    <line x1="160" y1="85" x2="220" y2="40" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Student Desks and Students Studying -->
  <!-- Desk 1 (Left Student) -->
  <g transform="translate(280, 340)">
    <!-- Desk Structure -->
    <rect x="0" y="110" width="180" height="12" rx="4" fill="#94A3B8"/>
    <line x1="20" y1="122" x2="20" y2="200" stroke="#64748B" stroke-width="6"/>
    <line x1="160" y1="122" x2="160" y2="200" stroke="#64748B" stroke-width="6"/>
    <!-- Books on Desk -->
    <rect x="30" y="98" width="45" height="12" rx="2" fill="#3B82F6"/>
    <rect x="35" y="86" width="38" height="12" rx="2" fill="#10B981"/>
    <!-- Notebook & Pen -->
    <rect x="90" y="100" width="50" height="10" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
    <line x1="130" y1="95" x2="145" y2="105" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Student 1 -->
    <circle cx="90" cy="30" r="26" fill="#FCD34D"/> <!-- Face -->
    <path d="M 64 30 Q 90 5 116 30 Q 110 8 75 12 Z" fill="#1E293B"/> <!-- Hair -->
    <!-- Torso -->
    <path d="M 60 70 Q 90 60 120 70 L 115 110 L 65 110 Z" fill="#059669"/>
  </g>

  <!-- Desk 2 (Right Student) -->
  <g transform="translate(520, 330)">
    <!-- Desk Structure -->
    <rect x="0" y="120" width="190" height="12" rx="4" fill="#94A3B8"/>
    <line x1="20" y1="132" x2="20" y2="210" stroke="#64748B" stroke-width="6"/>
    <line x1="170" y1="132" x2="170" y2="210" stroke="#64748B" stroke-width="6"/>
    <!-- Books on Desk -->
    <rect x="110" y="106" width="50" height="14" rx="2" fill="#F59E0B"/>
    <rect x="30" y="112" width="60" height="8" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>

    <!-- Student 2 (Asking Question / Hand Raised) -->
    <circle cx="85" cy="40" r="26" fill="#FCD34D"/> <!-- Face -->
    <path d="M 60 38 Q 85 12 110 38 Q 105 16 70 20 Z" fill="#7C2D12"/> <!-- Hair -->
    <!-- Torso -->
    <path d="M 55 80 Q 85 70 115 80 L 110 120 L 60 120 Z" fill="#4F46E5"/>
    <!-- Raised Hand -->
    <path d="M 110 85 Q 130 50 135 15" fill="none" stroke="#FCD34D" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Inspiring Lightbulb / Shine Accent Floating Badge -->
  <g transform="translate(620, 190)">
    <rect width="130" height="50" rx="25" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <circle cx="28" cy="25" r="15" fill="#FEF3C7"/>
    <path d="M 28 17 Q 34 23 28 29 M 25 31 L 31 31" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="24" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Doubt Solved</text>
    <text x="50" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#10B981">1-on-1 Guidance</text>
  </g>
</svg>

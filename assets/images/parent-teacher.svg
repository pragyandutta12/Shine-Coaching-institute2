<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="cardSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#ptGrad)"/>

  <!-- Discussion Table Card -->
  <g filter="url(#cardSh)">
    <rect x="60" y="50" width="680" height="400" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Progress Chart on Table / Wall -->
  <rect x="250" y="80" width="300" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="270" y="110" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#1E293B">Academic Progress Report</text>
  
  <!-- Bar chart visual -->
  <rect x="280" y="160" width="35" height="50" rx="4" fill="#93C5FD"/>
  <rect x="335" y="140" width="35" height="70" rx="4" fill="#60A5FA"/>
  <rect x="390" y="130" width="35" height="80" rx="4" fill="#3B82F6"/>
  <rect x="445" y="115" width="35" height="95" rx="4" fill="#1D4ED8"/>
  <rect x="500" y="105" width="35" height="105" rx="4" fill="#10B981"/>

  <!-- Teacher Side (Left) -->
  <g transform="translate(110, 210)">
    <circle cx="50" cy="50" r="30" fill="#FCD34D"/> <!-- Head -->
    <path d="M 25 50 Q 50 20 75 50 Q 65 25 35 30 Z" fill="#1E293B"/> <!-- Hair -->
    <path d="M 20 95 L 50 85 L 80 95 L 75 160 L 25 160 Z" fill="#2563EB"/> <!-- Suit -->
    <!-- Explanation Gesture -->
    <path d="M 75 105 Q 110 95 135 110" fill="none" stroke="#FCD34D" stroke-width="8" stroke-linecap="round"/>
    <text x="50" y="190" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Mentor</text>
  </g>

  <!-- Parent Side (Right) -->
  <g transform="translate(590, 210)">
    <circle cx="50" cy="50" r="30" fill="#FCD34D"/> <!-- Head -->
    <path d="M 25 50 Q 50 20 75 50 Q 70 30 40 32 Z" fill="#475569"/> <!-- Hair -->
    <path d="M 20 95 L 50 85 L 80 95 L 75 160 L 25 160 Z" fill="#059669"/> <!-- Jacket -->
    <!-- Reassuring Gesture -->
    <path d="M 25 105 Q -10 95 -35 110" fill="none" stroke="#FCD34D" stroke-width="8" stroke-linecap="round"/>
    <text x="50" y="190" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Parent</text>
  </g>

  <!-- Reassuring Dialogue Bubble -->
  <g transform="translate(290, 270)">
    <rect width="220" height="70" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
    <polygon points="340,340 350,355 360,340" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="110" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle">Regular Progress Updates</text>
    <text x="110" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Transparent Feedback &amp; Care</text>
  </g>
</svg>
